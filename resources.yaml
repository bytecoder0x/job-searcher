# Sources to scan. Config-driven — the agent reads this file, code doesn't change.
#
# Fields of each resource:
#   name      — human-readable name
#   url       — entry point for the scan
#   category  — job | vc_board | bounty | contest | grant | hackathon
#   render    — static (HTML directly) | js (render JS / headless) | getro (Getro JSON API)
#               | consider (Getro's newer "Consider" platform search-jobs JSON API — no browser, no LLM)
#               | greenhouse | lever | ashby | workable (direct-company ATS JSON API — no browser, no LLM)
#               | a16z (a16z crypto portfolio jobs — inlined JSON, no browser, no LLM)
#               | remoteok (RemoteOK tag-scoped JSON API — no browser, no LLM)
#               | jobstash (JobStash middleware JSON API — no browser, no LLM) | api
#   enabled   — whether to scan (can be disabled temporarily without deleting)
#   notes     — hints for fetcher/matcher
#
# render: many VC boards (jobs.<vc>.xyz) are Getro/Consider networks with JS rendering;
# marked js. First we try WebFetch/HTTP; where it returns nothing — a headless browser.

meta:
  # How many days to remember already-shown positions (dedup across runs)
  dedup_retention_days: 30
  # How many top positions to send in the digest per scan
  digest_top_n: 15
  # Freshness window: how many days back to include jobs.
  # default — for the scheduled scan and when the user gives none; max — a hard ceiling.
  default_window_days: 1
  max_window_days: 7
  # Runaway safety ceiling on positions sent to the expensive scorer (sonnet),
  # AFTER the cheap haiku prefilter. Normally never trips — the prefilter already
  # culls off-field roles, and everything it keeps IS scored (in batches). Set
  # high on purpose so "score them all" holds; the overflow (if ever) is
  # reported, not silently dropped. Tune live with /set cap.
  matcher_input_cap: 500

